<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | ICC RAS Workshop</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // The 2025 site used to live at the root (/cfp, /speakers.html, /images/...).
      // Send those old links to their new home under /2025/.
      // ponytail: GitHub Pages has no server redirects, so this is a JS redirect from the 404 page.
      var p = location.pathname;
      if (/^\/(cfp|speakers|schedule|organizers|abstracts)(\.html)?\/?$/.test(p) || /^\/images\//.test(p)) {
        location.replace("/2025" + p + location.search + location.hash);
      }
    </script>
    <style>
      body { margin: 0; background: #f4f6fa; color: #17233f; font: 1.0625rem/1.6 system-ui, sans-serif; }
      main { max-width: 40rem; margin: 0 auto; padding: 4rem 1.25rem; }
      h1 { font-size: 2rem; line-height: 1.2; }
      a { color: #2640e8; }
      :focus-visible { outline: 3px solid #2640e8; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>This page doesn't exist. <a href="/">See all workshop editions</a>.</p>
    </main>
  </body>
</html>
