name: Deploy ICC RAS Workshop 2025 website
on:
  push:
    branches: [main]
    paths:
      - "editions/2025/**"
      - ".github/workflows/deploy-2025.yml"
      - ".github/workflows/deploy.yml"
      - "package-lock.json"
      - ".nvmrc"
  workflow_dispatch:

concurrency:
  group: deploy-2025
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      build-script: build:2025
      publish-dir: ./editions/2025/dist
      repository: icc-ras-workshop/2025
    secrets:
      deploy_key: ${{ secrets.ORG_2025_DEPLOY_KEY }}
