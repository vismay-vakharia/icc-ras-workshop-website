name: Deploy ICC RAS Workshop 2025 Website
on:
  push:
    branches: [main]
    paths:
      - 'editions/2025/**'
      - '.github/workflows/deploy-2025.yml'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: deploy-2025
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build site
        run: npm run build:2025

      - name: Push to icc-ras-workshop 2025 repo
        uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.ORG_2025_DEPLOY_KEY }}
          publish_dir: ./editions/2025/dist
          external_repository: icc-ras-workshop/2025
          publish_branch: main
