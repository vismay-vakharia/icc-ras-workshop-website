name: Deploy ICC RAS Workshop 2027 website
on:
  push:
    branches: [main]
    paths:
      - "editions/2027/**"
      - ".github/workflows/deploy-2027.yml"
      - ".github/workflows/deploy.yml"
      - "package-lock.json"
      - ".nvmrc"
  workflow_dispatch:

concurrency:
  group: deploy-2027
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      build-script: build:2027
      publish-dir: ./editions/2027/dist
      repository: icc-ras-workshop/2027
    secrets:
      deploy_key: ${{ secrets.ORG_2027_DEPLOY_KEY }}
