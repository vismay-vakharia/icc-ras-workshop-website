name: Deploy ICC RAS Workshop portal (root site)
on:
  push:
    branches: [main]
    paths:
      - "editions/portal/**"
      - ".github/workflows/deploy-portal.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-portal
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      publish-dir: ./editions/portal
      repository: icc-ras-workshop/icc-ras-workshop.github.io
    secrets:
      deploy_key: ${{ secrets.ORG_PORTAL_DEPLOY_KEY }}
